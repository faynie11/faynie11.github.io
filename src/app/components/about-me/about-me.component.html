<div class="w-full bg-slate-50 px-6 py-20 dark:bg-slate-950 sm:py-24">
  <div class="mx-auto grid max-w-5xl grid-cols-1 items-center gap-12 lg:grid-cols-2">
    <!-- Photo -->
    <div appReveal class="order-1 flex justify-center lg:order-2">
      <div class="relative">
        <div class="absolute -inset-3 rounded-3xl bg-gradient-to-tr from-brand-500/20 to-indigo-500/20 blur-xl"></div>
        <img
          [src]="myPhoto"
          [alt]="profile.name"
          width="288"
          height="288"
          class="relative h-72 w-72 rounded-2xl object-cover shadow-lg ring-1 ring-slate-900/10 dark:ring-white/10" />
      </div>
    </div>

    <!-- Copy -->
    <div appReveal class="order-2 lg:order-1">
      <span class="text-sm font-semibold text-brand-600 dark:text-brand-400">About me</span>
      <h2 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white sm:text-4xl">
        Frontend developer
      </h2>
      @for (paragraph of description; track $index) {
        <p class="mt-4 text-slate-600 dark:text-slate-300">{{ paragraph }}</p>
      }

      <div class="mt-8 flex flex-wrap items-center gap-3">
        <button
          type="button"
          [appCopy]="profile.email"
          #copyEmail="appCopy"
          [attr.aria-label]="'Copy email address ' + profile.email"
          class="inline-flex items-center gap-2 rounded-lg bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 active:scale-95">
          @if (copyEmail.copied()) {
            <svg class="h-4 w-4 icon-pop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
            Copied!
          } @else {
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0l-9.75 6-9.75-6" />
            </svg>
            {{ profile.email }}
          }
        </button>

        <a
          [href]="profile.cvPath"
          [download]="profile.cvFileName"
          class="inline-flex items-center gap-2 rounded-lg border border-slate-300 px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-white dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">
          Download CV
        </a>
      </div>
    </div>
  </div>

  <!-- Skills -->
  <div class="mx-auto mt-20 max-w-5xl">
    <div appReveal class="mx-auto max-w-2xl text-center">
      <span class="text-sm font-semibold text-brand-600 dark:text-brand-400">Toolbox</span>
      <h3 class="mt-2 text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white sm:text-3xl">
        What I work with
      </h3>
    </div>

    <div class="mt-10 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (group of skills; track group.title) {
        <div
          [appReveal]="$index * 70"
          class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition hover:shadow-md dark:border-slate-800 dark:bg-slate-900">
          <span
            class="flex h-11 w-11 items-center justify-center rounded-lg bg-brand-50 text-brand-600 dark:bg-brand-600/15 dark:text-brand-400">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="group.icon" />
            </svg>
          </span>
          <h4 class="mt-4 font-semibold text-slate-900 dark:text-white">{{ group.title }}</h4>
          <ul class="mt-3 flex flex-wrap gap-2">
            @for (item of group.items; track item) {
              <li
                class="rounded-md bg-slate-100 px-2 py-1 text-xs font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                {{ item }}
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</div>
