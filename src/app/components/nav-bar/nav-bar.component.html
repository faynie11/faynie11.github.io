<header
  class="sticky top-0 z-50 border-b border-slate-200 bg-white/85 backdrop-blur-md dark:border-slate-800 dark:bg-slate-950/85">
  <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-6" aria-label="Main">
    <!-- Brand -->
    <button
      type="button"
      (click)="scrollTo('home')"
      class="group flex items-center gap-2 rounded-lg outline-none transition-transform duration-150 active:scale-95 focus-visible:ring-2 focus-visible:ring-brand-500/50">
      <span
        class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 text-sm font-bold text-white transition-transform duration-300 group-hover:rotate-6 group-hover:scale-110">
        JW
      </span>
      <span class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">
        {{ profile.name }}
      </span>
    </button>

    <!-- Desktop links -->
    <div class="relative hidden items-center gap-1 md:flex">
      <!-- Pill that slides between links instead of snapping. -->
      @if (indicator(); as pill) {
        <span
          aria-hidden="true"
          class="pointer-events-none absolute inset-y-0 left-0 rounded-lg bg-brand-50 transition-[transform,width] duration-300 ease-out dark:bg-brand-600/15"
          [style.width.px]="pill.width"
          [style.transform]="'translateX(' + pill.left + 'px)'"></span>
      }

      @for (link of links; track link.id) {
        <button
          #navBtn
          type="button"
          (click)="scrollTo(link.id)"
          [attr.aria-current]="activeId() === link.id ? 'true' : null"
          class="relative rounded-lg px-3 py-2 text-sm font-medium outline-none transition-[color,transform] duration-200 active:scale-95 focus-visible:ring-2 focus-visible:ring-brand-500/50"
          [class]="
            activeId() === link.id
              ? 'text-brand-700 dark:text-brand-300'
              : 'text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white'
          ">
          {{ link.label }}
        </button>
      }
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-1">
      <a
        [href]="profile.githubUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub profile"
        class="rounded-lg p-2 text-slate-500 transition duration-200 hover:-translate-y-0.5 hover:bg-slate-100 hover:text-slate-900 active:scale-90 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.5 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.26 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.2.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z" />
        </svg>
      </a>

      <a
        [href]="profile.linkedinUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn profile"
        class="rounded-lg p-2 text-slate-500 transition duration-200 hover:-translate-y-0.5 hover:bg-slate-100 hover:text-slate-900 active:scale-90 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.55V9h3.57v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0Z" />
        </svg>
      </a>

      <button
        type="button"
        (click)="toggleTheme()"
        role="switch"
        [attr.aria-checked]="isDark()"
        aria-label="Toggle dark mode"
        class="overflow-hidden rounded-lg p-2 text-slate-500 transition duration-200 hover:bg-slate-100 hover:text-slate-900 active:scale-90 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white">
        @if (isDark()) {
          <svg class="h-5 w-5 icon-pop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 3v2.25m6.36.39l-1.59 1.59M21 12h-2.25m-.39 6.36l-1.59-1.59M12 18.75V21m-4.77-3.23l-1.59 1.59M5.25 12H3m3.23-4.77L4.64 5.64M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
        } @else {
          <svg class="h-5 w-5 icon-pop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21.75 15A9.75 9.75 0 118.99 2.25 7.5 7.5 0 0021.75 15z" />
          </svg>
        }
      </button>

      <!-- Mobile menu trigger -->
      <button
        type="button"
        (click)="toggleMobile()"
        [attr.aria-expanded]="mobileOpen()"
        aria-controls="mobile-menu"
        aria-label="Toggle navigation menu"
        class="rounded-lg p-2 text-slate-500 transition duration-200 hover:bg-slate-100 hover:text-slate-900 active:scale-90 md:hidden dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white">
        <svg
          class="h-5 w-5 transition-transform duration-300"
          [class.rotate-90]="mobileOpen()"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          @if (mobileOpen()) {
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          } @else {
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
          }
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile links. Kept mounted and collapsed with a 0fr->1fr grid row so it
       animates on the way out as well as on the way in. -->
  <div
    id="mobile-menu"
    [attr.inert]="mobileOpen() ? null : ''"
    class="grid overflow-hidden transition-[grid-template-rows,opacity] duration-300 ease-out md:hidden"
    [class]="mobileOpen() ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'">
    <div class="min-h-0">
      <div class="border-t border-slate-200 px-6 py-3 dark:border-slate-800">
        @for (link of links; track link.id) {
          <button
            type="button"
            (click)="scrollTo(link.id)"
            class="block w-full rounded-lg px-3 py-2 text-left text-sm font-medium transition duration-200 active:scale-[0.98]"
            [class]="
              activeId() === link.id
                ? 'bg-brand-50 text-brand-700 dark:bg-brand-600/15 dark:text-brand-300'
                : 'text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800'
            ">
            {{ link.label }}
          </button>
        }
      </div>
    </div>
  </div>
</header>
