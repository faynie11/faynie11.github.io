<div class="w-full bg-white px-6 py-20 dark:bg-slate-900/40 sm:py-24">
  <div appReveal class="mx-auto max-w-2xl text-center">
    <span class="text-sm font-semibold text-brand-600 dark:text-brand-400">Background</span>
    <h2 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white sm:text-4xl">
      Education
    </h2>
  </div>

  <ol class="relative mx-auto mt-12 max-w-2xl border-l border-slate-200 dark:border-slate-800">
    @for (entry of education; track entry.school) {
      <!-- The reveal transform sits on the card, not the <li>: transforming the
           <li> would make it the containing block for the absolutely positioned
           timeline dot and shift the dot mid-animation. -->
      <li class="mb-10 ml-8 last:mb-0">
        <span
          class="absolute -left-4 flex h-8 w-8 items-center justify-center rounded-full bg-brand-600 ring-4 ring-white dark:ring-slate-950">
          <svg class="h-4 w-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" />
          </svg>
        </span>

        <div
          [appReveal]="$index * 90"
          class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <h3 class="font-semibold text-slate-900 dark:text-white">{{ entry.school }}</h3>
            <span
              class="shrink-0 rounded-md bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300">
              {{ entry.period }}
            </span>
          </div>

          <p class="mt-1 text-sm font-medium text-brand-600 dark:text-brand-400">
            {{ entry.degree }} &middot; {{ entry.field }}
          </p>

          <p class="mt-3 text-sm leading-relaxed text-slate-500 dark:text-slate-400">
            {{ entry.description }}
          </p>
        </div>
      </li>
    }
  </ol>
</div>
